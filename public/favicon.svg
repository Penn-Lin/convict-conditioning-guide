<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  width="32"
  height="32"
  role="img"
  aria-label="囚徒健身"
>
  <!-- 标记 = 站名本身：「囚」（囗 + 人）。与 PWA 图标 scripts/gen-icons.py 同一套几何。 -->
  <style>
    /* 标签栏有浅色也有深色，单一颜色必然在其中一种下看不见 —— 用 prefers-color-scheme
       给两套描边色。（注意：跟随的是系统偏好，不是站内手动切换的主题；标签栏本来也归系统管。） */
    .mark {
      fill: none;
      stroke: #1a1d21;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @media (prefers-color-scheme: dark) {
      .mark {
        stroke: #f3f4f6;
      }
    }
  </style>

  <!-- 囗：外框，略细 -->
  <rect class="mark" x="5.4" y="5.4" width="21.2" height="21.2" rx="2.9" stroke-width="2.1" />
  <!-- 人：左脚 → 顶点 → 右脚，一条折线 -->
  <polyline class="mark" points="9.8,22.9 16,9.1 22.4,23.2" stroke-width="3.1" />
</svg>
